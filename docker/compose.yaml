# Two containers and one deliberate hole in the wall.
#
# `factory` has a shell, a compiler, and a long-lived Claude token. It sits on
# a network with NO route off the machine. The only way out is `egress`, which
# forwards to an anchored allowlist and logs what it refused.
#
# That is the whole security model, and it is structural: an agent that talks
# its way past every tool check still has nowhere to send anything.
#
#   cp .env.example .env        # then put your token in it
#   docker compose up --build
#
name: helmsted

services:
  factory:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on: [egress]
    networks: [walled]
    # No published port here on purpose. A container attached only to an
    # internal network cannot be NAT-ed into either — no gateway means no
    # ingress as well as no egress — and Docker publishes nothing, silently.
    # The `ingress` service below carries the console out instead.
    environment:
      # Generated by the operator with `claude setup-token`. Never baked into
      # the image and never committed — .env is gitignored.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run "claude setup-token" and put it in docker/.env}
      # The installation root. Must stay under the mount, or companies are
      # written to the container's own filesystem and lost on restart.
      HELMSTED_ROOT: /data
      # Only used when the installation is empty, to name the first company.
      HELMSTED_COMPANY: ${HELMSTED_COMPANY:-Untitled Company}
      HELMSTED_BUSINESS: ${HELMSTED_BUSINESS:-}
      HELMSTED_CHAIR: ${HELMSTED_CHAIR:-Chair}
      HELMSTED_CEO: ${HELMSTED_CEO:-CEO}
      # Everything that speaks HTTP reads these. Anything that ignores them
      # still has no route — the network is internal.
      HTTP_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
      NO_PROXY: localhost,127.0.0.1,egress
    # Docker Desktop maps bind-mount ownership, so on macOS the image's own
    # unprivileged user writes files that come back owned by you. A rootful
    # Linux daemon does not map anything — uncomment this and set UID/GID in
    # docker/.env to run as yourself. The entrypoint says so if it matters.
    # user: "${UID:-10001}:${GID:-10001}"
    volumes:
      # A BIND MOUNT, not a named volume, so every company is an ordinary
      # directory on your disk: readable without Docker, backed up by whatever
      # already backs up your home folder, and recoverable if the container is
      # thrown away. This is the only writable state the factory has.
      - ${HELMSTED_DATA:-${HOME}/helmsted-data}:/data
    restart: unless-stopped
    # An agent shell should not be able to fork-bomb the host or read the
    # kernel keyring on the way to a privilege escalation.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    # Everything the factory needs to write is under /data and these. The rest
    # of the filesystem is read-only, so an agent cannot rewrite its own image.
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/labs:size=256m
      - /app/node_modules/.cache:size=128m
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4173/api/companies').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # The only way IN. A dumb TCP forwarder: no token, no agent code, no shell
  # worth having. It is attached to a routable network because publishing a
  # port requires one — which is precisely why the factory is not.
  ingress:
    image: alpine/socat:1.8.0.0
    depends_on: [factory]
    networks: [walled, outside]
    ports: ['127.0.0.1:${PORT:-4173}:4173']
    command: ['-d', 'TCP-LISTEN:4173,fork,reuseaddr', 'TCP:factory:4173']
    restart: unless-stopped
    user: nobody
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 64m

  egress:
    build:
      context: proxy
    # Runs as the unprivileged user from the start. See tinyproxy.conf: with
    # every capability dropped there is no way to drop privileges later.
    user: tinyproxy
    networks: [walled, outside]
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/var/run/tinyproxy', '/tmp']
    cap_drop: [ALL]

networks:
  # No gateway. Containers here reach each other and nothing else.
  walled:
    internal: true
  # Only the proxy is attached to this one.
  outside: {}
