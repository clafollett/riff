User tinyproxy
Group tinyproxy
Port 8888
Timeout 600
LogLevel Notice
LogFile "/dev/stdout"
MaxClients 200

# Anything not matched by a Filter rule is DENIED. This is the whole point:
# default-deny, with the allowlist compiled in at start.
Filter "/etc/tinyproxy/filter.re"
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off

# HTTPS is CONNECT — restrict which ports may be tunnelled so the proxy cannot
# be used to reach arbitrary services on an allowed host.
ConnectPort 443
