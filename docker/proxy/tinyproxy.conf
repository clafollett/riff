# No User/Group directives on purpose.
#
# Those tell tinyproxy to start as root and drop privileges, which needs
# CAP_SETUID and CAP_SETGID — and this container drops every capability. It
# crash-looped on "Unable to change to group". The container starts AS the
# unprivileged user instead, so there is no privilege to drop.
Port 8888
Timeout 600
# Connect logs one line per request, which is the audit trail. Notice did not,
# and `LogFile /dev/stdout` never opened — tinyproxy stats a path then opens it
# and refuses when the two disagree, which a symlink into /proc always does. So
# the proxy ran for weeks recording nothing, and when a researcher reported
# being refused everywhere there was no independent record to check her against.
# No LogFile at all means stdout, which is where docker wants it.
LogLevel Connect
MaxClients 200

# A host matched by a Filter rule is DENIED; everything else is allowed.
#
# This was default-deny with an allowlist until 2026-09-03. See denylist.conf
# for what changed and SECURITY.md for what now holds the line — it is not this
# file, and this file no longer claims to be it.
Filter "/etc/tinyproxy/filter.re"
FilterDefaultDeny No
FilterExtended Yes
FilterURLs Off

# HTTPS is CONNECT — restrict which ports may be tunnelled so the proxy cannot
# be used to reach arbitrary services on an allowed host.
ConnectPort 443
