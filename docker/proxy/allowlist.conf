# Egress allowlist.
#
# The app container sits on an `internal: true` network — it has NO route to
# the internet except through this proxy. That is the structural control: the
# token inside the container is readable by anything with a shell, so the thing
# that actually prevents exfiltration is having nowhere to send it.
#
# One host per line. Subdomains need their own entry.

# the model
api.anthropic.com
statsig.anthropic.com
sentry.io

# packages
registry.npmjs.org
nodejs.org

# source
github.com
api.github.com
codeload.github.com
objects.githubusercontent.com
raw.githubusercontent.com

# ---------------------------------------------------------------- research
#
# A company of engineers that can only reason from training data is a company
# reasoning about a fast-moving field from a fixed point in the past. These
# are documentation and discussion, added so staff can look things up.
#
# Every host here is also somewhere data could in principle be posted, so this
# is a real trade against the anti-exfiltration argument above. It is worth
# making because the container holds no credential for any of them — there is
# nowhere here to authenticate as anyone. Keep it that way: do not add a host
# the container has a token for.

# the protocol and the model
docs.anthropic.com
modelcontextprotocol.io
spec.modelcontextprotocol.io

