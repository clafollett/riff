# WHAT IS DELIBERATELY NOT HERE, and why the list can afford to be generous:
#
# Nothing that takes a credential, and nothing whose main verb is "post". The
# container holds a live model token and, inside a container, a shell — so the
# only thing preventing exfiltration is having nowhere to send it. Every host
# above is a place to READ. Adding a paste site, an issue tracker you can
# write to, a webhook relay or a form host would trade the one structural
# control for a convenience, whatever the intention behind it.
#
# github.com is the argued exception and it is above under "source": it is
# needed to fetch code, and the container holds no GitHub credential. If that
# ever stops being true, this line is the one to revisit first.
#
# Anything an operator wants open on their own installation goes in
# allowlist.local.conf, which is gitignored and appended at build time.

