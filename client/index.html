<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The LaFollett Bed &amp; Breakfast</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="chip">staff <b id="n-staff">–</b></div>
      <div class="chip" id="chip-env">envelope <b id="n-appr">–</b></div>
      <div class="chip">notes <b id="n-notes">–</b></div>
      <div class="chip">spent today <b id="n-spend">–</b></div>
      <div class="chip" id="chip-inn">the inn <b id="n-inn">asleep</b></div>
      <button id="btn-open" class="go">Open the Inn</button>
      <button id="btn-meeting">Call a meeting</button>
    </div>
    <div id="hint">arrows / WASD to walk · you are the Inn Keeper</div>
  </div>

  <div id="side">
    <h2>The Envelope</h2>
    <div id="approvals"><div class="empty">Nothing waiting on you.</div></div>
    <h2>Morale</h2>
    <div id="morale"><div class="empty">Nobody has done anything yet.</div></div>
    <h2>The Grounds</h2>
    <div id="log"></div>
  </div>
</div>
<script type="module" src="/village.js"></script>
</body>
</html>
