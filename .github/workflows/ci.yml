name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 26 or newer: the server is run straight from TypeScript by type
          # stripping, with no build step.
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the console, then drives it against a throwaway installation —
      # HELMSTED_ROOT is set by the suite, so this never touches a real one.
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is where the staff get a shell, so a change that breaks the
      # build is a change that breaks the only place this is safe to run.
      - run: docker build -f docker/Dockerfile -t helmsted:ci .
      - run: docker build -f docker/Dockerfile --target dev -t helmsted:ci-dev .
